<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vulnerability Details | SecureOps Portal</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    /* Summary mini-cards strip */
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width:992px) { .summary-strip { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width:576px) { .summary-strip { grid-template-columns: repeat(2, 1fr); } }

    .sum-card {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      text-align: center;
    }
    .sum-card.critical { border-color: rgba(255,59,48,0.3); background: rgba(255,59,48,0.06); }
    .sum-card.high     { border-color: rgba(255,149,0,0.3); background: rgba(255,149,0,0.06); }
    .sum-card.medium   { border-color: rgba(255,204,0,0.3); background: rgba(255,204,0,0.06); }
    .sum-card.low      { border-color: rgba(52,199,89,0.3); background: rgba(52,199,89,0.06); }

    .sum-val { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .sum-lbl { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-top: 3px; }

    .sum-card.critical .sum-val { color: var(--color-critical); }
    .sum-card.high .sum-val     { color: var(--color-high); }
    .sum-card.medium .sum-val   { color: var(--color-medium); }
    .sum-card.low .sum-val      { color: var(--color-low); }
    .sum-card.total .sum-val    { color: var(--color-primary); }

    /* Table card */
    .table-card { padding: 20px; }
    .dt-top-row  { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
    .dt-bottom-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; gap: 8px; }

    /* Filter panel */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    /* Action buttons bar */
    .actions-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Print styles */
    @media print {
      .navbar-portal, .fab, .toast-container, .filter-area, .actions-bar, .category-nav { display: none !important; }
      .page-wrapper { padding-top: 0 !important; }
      .glass-card { background: white !important; border: 1px solid #ddd !important; box-shadow: none !important; }
      body { background: white !important; color: black !important; }
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="bg-grid"></div>

  <!-- Loading -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loader-logo"><i class="fas fa-shield-halved"></i></div>
    <div class="loader-text">Loading Vulnerability Data</div>
    <div class="loader-bar"><div class="loader-progress"></div></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar-portal">
    <a href="index.html" class="navbar-brand">
      <div class="navbar-logo"><i class="fas fa-shield-halved"></i></div>
      <div class="navbar-title">
        SecureOps Portal
        <span>Vulnerability Management</span>
      </div>
    </a>

    <div class="navbar-center">
      <div class="nav-search-wrap">
        <i class="fas fa-search nav-search-icon"></i>
        <input type="text" class="nav-search" id="globalSearch" placeholder="Quick search...">
      </div>
    </div>

    <div class="navbar-right">
      <div class="nav-datetime">
        <div class="nav-date" id="navDate"></div>
        <div class="nav-time" id="navTime"></div>
      </div>
      <button class="nav-btn" id="themeToggle" title="Toggle Theme">
        <i class="fas fa-sun"></i>
      </button>
      <a href="index.html" class="nav-btn" title="Dashboard">
        <i class="fas fa-home"></i>
      </a>
      <div class="nav-avatar">PM</div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="page-wrapper">
    <div class="container-fluid-custom">

      <!-- Breadcrumb -->
      <div class="breadcrumb-portal animate-fade-up">
        <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
        <span class="sep"><i class="fas fa-chevron-right"></i></span>
        <span id="breadcrumbCategory">Details</span>
      </div>

      <!-- Page Title + Actions -->
      <div class="page-header animate-fade-up animate-delay-1">
        <div>
          <h1 class="page-title" id="pageTitle"><i class="fas fa-shield-alt"></i> Vulnerability Details</h1>
          <div class="page-subtitle">Detailed view with advanced filtering and export capabilities</div>
        </div>
        <div class="actions-bar">
          <button class="btn-portal btn-ghost-portal" id="btnExportExcel"><i class="fas fa-file-excel"></i> Export Excel</button>
          <button class="btn-portal btn-ghost-portal" id="btnExportPDF"><i class="fas fa-file-pdf"></i> Export PDF</button>
          <button class="btn-portal btn-ghost-portal" id="btnPrint"><i class="fas fa-print"></i> Print</button>
          <button class="btn-portal btn-primary-portal" id="btnRefresh"><i class="fas fa-rotate-right"></i> Refresh</button>
        </div>
      </div>

      <!-- Category Navigation -->
      <div class="category-nav animate-fade-up animate-delay-1">
        <a href="details.html?category=application" class="category-pill" data-cat="application"><i class="fas fa-code"></i> Application</a>
        <a href="details.html?category=device" class="category-pill" data-cat="device"><i class="fas fa-server"></i> Device</a>
        <a href="details.html?category=astra" class="category-pill" data-cat="astra"><i class="fas fa-shield-alt"></i> ASTRA</a>
        <a href="details.html?category=database" class="category-pill" data-cat="database"><i class="fas fa-database"></i> Database</a>
      </div>

      <!-- Summary Cards -->
      <div class="summary-strip animate-fade-up animate-delay-2">
        <div class="sum-card critical">
          <div class="sum-val" id="sum-critical">—</div>
          <div class="sum-lbl">Critical</div>
        </div>
        <div class="sum-card high">
          <div class="sum-val" id="sum-high">—</div>
          <div class="sum-lbl">High</div>
        </div>
        <div class="sum-card medium">
          <div class="sum-val" id="sum-medium">—</div>
          <div class="sum-lbl">Medium</div>
        </div>
        <div class="sum-card low">
          <div class="sum-val" id="sum-low">—</div>
          <div class="sum-lbl">Low</div>
        </div>
        <div class="sum-card" style="border-color:rgba(255,59,48,0.3);background:rgba(255,59,48,0.06)">
          <div class="sum-val" id="sum-past-due" style="color:var(--color-critical)">—</div>
          <div class="sum-lbl">Past Due</div>
        </div>
        <div class="sum-card total" style="border-color:rgba(0,180,255,0.3);background:rgba(0,180,255,0.06)">
          <div class="sum-val" id="sum-total">—</div>
          <div class="sum-lbl">Total Active</div>
        </div>
      </div>

      <!-- Filters Panel -->
      <div class="glass-card filters-panel animate-fade-up animate-delay-2 filter-area">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div class="section-title" style="margin-bottom:0">
            <i class="fas fa-filter" style="color:var(--color-primary)"></i> Advanced Filters
          </div>
          <button class="filter-toggle-btn" id="filterToggle">
            <i class="fas fa-chevron-up toggle-icon"></i>
            <span>Collapse</span>
          </button>
        </div>
        <div id="filterBody">
          <div class="filter-grid">
            <div>
              <label class="filter-label">Severity</label>
              <select class="filter-select" id="filterSeverity">
                <option value="">All Severities</option>
              </select>
            </div>
            <div>
              <label class="filter-label">Application</label>
              <select class="filter-select" id="filterApp">
                <option value="">All Applications</option>
              </select>
            </div>
            <div>
              <label class="filter-label">State / Status</label>
              <select class="filter-select" id="filterStatus">
                <option value="">All States</option>
              </select>
            </div>
            <div>
              <label class="filter-label">SLA Status</label>
              <select class="filter-select" id="filterSLA">
                <option value="">All SLA</option>
              </select>
            </div>
            <div>
              <label class="filter-label">Search</label>
              <input type="text" class="filter-input" id="filterSearch" placeholder="Keyword search...">
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn-portal btn-primary-portal" id="btnApplyFilters"><i class="fas fa-filter"></i> Apply Filters</button>
            <button class="btn-portal btn-ghost-portal" id="btnClearFilters"><i class="fas fa-times"></i> Clear All</button>
          </div>
        </div>
      </div>

      <!-- Main Data Table -->
      <div class="glass-card table-card animate-fade-up animate-delay-3">
        <div class="table-wrap">
          <table id="mainTable" class="portal-table w-100" style="font-size:0.8rem"></table>
        </div>
      </div>

    </div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fabTop" title="Back to Top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- Toasts -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
  <script src="js/sharepoint.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
